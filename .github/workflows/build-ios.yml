name: Build iOS IPA

# 手动触发：GitHub 仓库页 → Actions → "Build iOS IPA" → Run workflow
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync iOS platform
        run: npx cap sync ios

      # ---------- 签名证书导入 ----------
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > signing.p12
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          # 创建临时钥匙串
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain

          # 导入 p12
          security import signing.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain

          # 列出导入的证书身份，确认存在
          security find-identity -v -p codesigning build.keychain

          # 安装描述文件
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/904f4677-1864-41b6-86e3-cb8c39f460c8.mobileprovision"

      - name: Build archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=UN953L4E98 \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="00008130-001C75C20141001CVOPQZP" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ../../exportOptions.plist \
            -exportPath build

      - name: List output
        run: ls -la ios/App/build/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xianyu8-ios-ipa
          path: ios/App/build/*.ipa
          retention-days: 30
